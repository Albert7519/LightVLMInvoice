services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  vllm:
    image: vllm/vllm-openai:v0.18.1-cu130
    ports:
      - "8000:8000"
    environment:
      - VLLM_USE_MODELSCOPE=true
      - MODELSCOPE_CACHE=/root/.cache/modelscope
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    command:
      - ${VLLM_MODEL:-cyankiwi/Qwen3.5-2B-AWQ-BF16-INT8}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "${VLLM_MAX_MODEL_LEN:-8192}"
      - --gpu-memory-utilization
      - "${VLLM_GPU_MEMORY_UTILIZATION:-0.8}"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
      - modelscope_cache:/root/.cache/modelscope
    runtime: nvidia
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      start_period: 600s
      retries: 10
    depends_on:
      redis:
        condition: service_healthy

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    ports:
      - "${BACKEND_PORT:-8005}:8080"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - VLLM_API_BASE=http://vllm:8000/v1
      - VLLM_API_KEY=EMPTY
      - MAX_CONCURRENT_PAGES=${MAX_CONCURRENT_PAGES:-10}
      - UVICORN_HOST=0.0.0.0
      - UVICORN_PORT=8080
    volumes:
      - ../backend/uploads:/app/backend/uploads
      - ../logs/backend:/app/backend/logs
    depends_on:
      redis:
        condition: service_healthy
      vllm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/docs"]
      interval: 15s
      timeout: 5s
      retries: 5

  celery:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    command: celery -A celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-2}
    environment:
      - REDIS_URL=redis://redis:6379/0
      - VLLM_API_BASE=http://vllm:8000/v1
      - VLLM_API_KEY=EMPTY
      - MAX_CONCURRENT_PAGES=${MAX_CONCURRENT_PAGES:-10}
    volumes:
      - ../backend/uploads:/app/backend/uploads
      - ../logs/celery:/app/backend/logs
    depends_on:
      redis:
        condition: service_healthy
      vllm:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from celery_app import celery_app; import sys; sys.exit(0 if celery_app.control.ping(timeout=5) else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        VITE_API_BASE: /api/v1/invoices
    ports:
      - "${FRONTEND_PORT:-8002}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  huggingface_cache:
  modelscope_cache:
